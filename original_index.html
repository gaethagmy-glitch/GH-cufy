function showLoading(show){
  const g=document.getElementById('products-grid');
  if(show) g.innerHTML='<p style="color:var(--muted);text-align:center;grid-column:1/-1;padding:3rem">⏳ جاري تحميل المنتجات...</p>';
}

// ── RENDER PRODUCTS ──
function renderProds(){
  const g=document.getElementById('products-grid');
  if(!products.length){ g.innerHTML='<p style="color:var(--muted);text-align:center;grid-column:1/-1;padding:3rem">لا توجد منتجات حالياً 🌸</p>'; return; }
  g.innerHTML=products.map(p=>{
    const disp = p.discount ? fmt(calcDiscounted(p.origPrice,p.discount)) : p.price;
    const old  = p.discount ? `<del>${p.price}</del> ` : '';
    return `
    <div class="product-card${p.outOfStock?' prod-card-disabled':''}" onclick="${p.outOfStock?'':('openProd('+p.id+')')}">
      <div class="prod-img-wrap">
        <img src="${p.imgs[0]||''}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x500/F5EAE7/C9908A?text=نور'">
        ${p.tag?`<span class="prod-tag">${p.tag}</span>`:''}
        ${p.discount?`<span class="prod-tag" style="top:auto;bottom:1rem;background:var(--gold)">-${p.discount}%</span>`:''}

}

// ── مشاركة منتج ──
function shareProduct(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  const url = window.location.href.split('?')[0] + '?product=' + id;
  if(navigator.share){
    navigator.share({ title: p.name, text: p.name + ' — ' + p.price, url });
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('✅ تم نسخ رابط المنتج'));
  }
}

// ── مفضلة ──
function toggleFav(id){
  let favs = JSON.parse(localStorage.getItem('noor_favs')||'[]');
  if(favs.includes(id)){ favs = favs.filter(x=>x!==id); toast('تم الإزالة من المفضلة'); }
  else { favs.push(id); toast('❤️ تم الإضافة للمفضلة'); }
  localStorage.setItem('noor_favs', JSON.stringify(favs));
  renderProds();
}
function isFav(id){ return JSON.parse(localStorage.getItem('noor_favs')||'[]').includes(id); }

const _confirmOrder = confirmOrder;
confirmOrder = async function(){
  if(orderSubmitting){ toast('⏳ جاري معالجة طلبك...'); return; }
  orderSubmitting = true;
  try { await _confirmOrder(); } finally { setTimeout(()=>{ orderSubmitting=false; },3000); }
};
